name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        scala: ["2.13", "3.8.3"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JVM
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Install SBT
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https curl gnupg
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo apt-key add
          sudo apt-get update
          sudo apt-get install -y sbt

      - name: Compile
        run: sbt "++${{ matrix.scala }} ; compile"

      - name: Build assembly
        run: sbt "++${{ matrix.scala }} ; cli/assembly"

      - name: Run tests with coverage
        run: sbt "++${{ matrix.scala }} ; coverage ; test ; coverageReport"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-scala-${{ matrix.scala }}
          path: |
            lib/target/scala-${{ matrix.scala }}/scoverage-report/
            lib/target/scala-${{ matrix.scala }}/coverage-report/
          if-no-files-found: ignore
